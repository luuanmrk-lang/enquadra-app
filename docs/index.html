<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquadra — abrir no Expo Snack</title>
<style>
  :root{--bg:#0e161c;--card:#17222a;--ink:#e7eef3;--muted:#93a4b1;--accent:#4fb8bf;--accent-ink:#06282b;--bad:#ef7b6e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  main{max-width:480px;margin:0 auto;padding:32px 20px;display:flex;flex-direction:column;gap:18px}
  h1{font-size:1.7rem;margin:0}
  p{margin:0;color:var(--muted)}
  ol{margin:0;padding-left:20px;color:var(--muted)}
  li{margin:6px 0}
  b{color:var(--ink)}
  button{border:0;border-radius:14px;padding:18px;font-size:1.1rem;font-weight:800;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button[disabled]{opacity:.6}
  .card{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
  #st{font-weight:600;color:var(--ink)}
  #st.err{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>Enquadra</h1>
  <p>Captura guiada de fotos de imóveis.</p>
  <div class="card">
    <ol>
      <li>Instale o <b>Expo Go</b> na App Store ou Google Play.</li>
      <li>Toque no botão abaixo. O app abre no <b>Expo Snack</b>.</li>
      <li>No Snack, toque em <b>Run on device / Abrir no Expo Go</b>.</li>
    </ol>
  </div>
  <button id="go">Abrir o app no Snack</button>
  <p id="st" role="status"></p>
</main>
<script>
const BASE = 'https://raw.githubusercontent.com/luuanmrk-lang/enquadra-app/main/';
const ARQUIVOS = ['App.tsx','src/nav.tsx','src/lib/roteiro.ts','src/lib/store.tsx','src/lib/theme.ts','src/lib/nivel.ts',
  'src/components/ui.tsx','src/components/Ilustracao.tsx','src/screens/Home.tsx','src/screens/Novo.tsx','src/screens/Projeto.tsx',
  'src/screens/Preparo.tsx','src/screens/Ambientes.tsx','src/screens/Foto.tsx','src/screens/Camera.tsx','src/screens/Revisao.tsx'];
const DEPS = '@react-native-async-storage/async-storage@2.2.0,expo-camera@17.0.10,expo-constants@18.0.14,expo-file-system@19.0.24,expo-haptics@15.0.8,expo-screen-orientation@9.0.9,expo-sensors@15.0.8,expo-status-bar@3.0.9,react-native-safe-area-context@5.6.0,react-native-screens@4.16.0,react-native-svg@15.12.1,@react-navigation/native@7.1.8,@react-navigation/native-stack@7.3.16';
const st = document.getElementById('st'), btn = document.getElementById('go');
btn.onclick = async () => {
  btn.disabled = true; st.className = ''; st.textContent = 'Carregando os arquivos do app…';
  try {
    const files = {};
    for (const f of ARQUIVOS) {
      const r = await fetch(BASE + f + '?v=' + Date.now());
      if (!r.ok) throw new Error('Não consegui baixar ' + f);
      files[f] = { type: 'CODE', contents: await r.text() };
    }
    st.textContent = 'Abrindo o Snack…';
    const form = document.createElement('form');
    form.method = 'POST'; form.action = 'https://snack.expo.dev/';
    const add = (n, v) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = n; i.value = v; form.appendChild(i); };
    add('name', 'Enquadra'); add('description', 'Captura guiada de fotos de imóveis');
    add('platform', 'ios'); add('sdkVersion', '54.0.0'); add('dependencies', DEPS); add('files', JSON.stringify(files));
    document.body.appendChild(form); form.submit();
  } catch (e) {
    st.className = 'err'; st.textContent = (e && e.message ? e.message : 'Erro') + '. Verifique a internet e tente de novo.';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
